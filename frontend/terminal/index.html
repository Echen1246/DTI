<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DTI Optical Airspace Terminal</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <main class="terminal-shell">
    <section class="camera-panel" aria-label="main camera feed">
      <div class="camera-stage">
        <video
          id="cameraVideo"
          src="media/m2-res_720p_terminal_red_h264.mp4"
          controls
          preload="auto"
          playsinline
        ></video>
        <canvas id="cameraCanvas" width="1280" height="720"></canvas>
      </div>
    </section>

    <aside class="right-rail" aria-label="track space and assets">
      <section class="track-space-panel">
        <canvas id="spaceCanvas" width="520" height="330"></canvas>
      </section>

      <section class="assets-panel">
        <div class="panel-title">
          <span>Available defender assets</span>
          <strong>assignment queue</strong>
        </div>
        <div id="assetList" class="asset-list"></div>
      </section>
    </aside>

    <section class="bottom-panel" aria-label="track table and event log" hidden>
      <div class="track-table">
        <div class="table-head">
          <span>id</span>
          <span>class</span>
          <span>confidence</span>
          <span>range</span>
          <span>bearing</span>
          <span>priority</span>
          <span>assignment</span>
        </div>
        <div id="trackRows"></div>
      </div>
      <div class="event-log">
        <div class="panel-title">
          <span>operator log</span>
          <strong>rolling</strong>
        </div>
        <div id="eventLog"></div>
      </div>
    </section>
  </main>

  <script src="media/m2-res_720p_terminal_red_telemetry.js"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
